name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Validate Tauri Windows assets
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Missing src-tauri/icons/icon.ico"
          }
          Write-Host "Tauri Windows icon found."

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'My Study Hub ${{ github.ref_name }}'
          releaseBody: |
            Windows build of My Study Hub.

            Download the `-setup.exe` file below and run it once.

            This is the normal installed desktop edition: Start Menu shortcut, local SQLite data, offline WebView2 runtime, and in-place upgrades that keep your study data.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
