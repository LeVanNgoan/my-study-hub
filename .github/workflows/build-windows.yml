name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build My Study Hub for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Validate Tauri Windows assets
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Missing src-tauri/icons/icon.ico"
          }
          Write-Host "Tauri Windows icon found."

      - name: Validate stable installer configuration
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.identifier -ne "com.local.mystudyhub") { throw "Do not change the app identifier: it protects the stable data location." }
          if ($config.bundle.windows.nsis.installMode -ne "currentUser") { throw "Expected currentUser NSIS setup mode." }
          if ($config.bundle.windows.webviewInstallMode.type -ne "offlineInstaller") { throw "Expected self-contained WebView2 offline installer." }
          Write-Host "Stable installer configuration validated."

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri NSIS installer
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: My-Study-Hub-Setup-Windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
