[package]
name = "my-study-hub-local"
version = "2.1.0"
description = "Local-first personal study management desktop app"
authors = ["My Study Hub"]
edition = "2021"

[lib]
name = "my_study_hub_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
zip = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
